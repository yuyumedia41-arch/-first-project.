<!doctype html>
<html lang="ar">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#061219}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(110% 90% at 50% 38%,#11343D 0%,#0A2129 45%,#051118 100%)}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.layer{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
#beams{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0}
/* verses */
.verse{position:absolute;left:0;width:1920px;text-align:center;direction:rtl;font-family:'KFGQPC Hafs';color:#F7E6B5;line-height:1.9;white-space:nowrap;
  text-shadow:0 0 28px rgba(255,214,140,.45),0 0 2px rgba(255,240,200,.8);transform-origin:50% 50%}
.verse .ph{transition:none;display:inline}
.verse .ph.on{color:#FFD77A;text-shadow:0 0 30px rgba(255,200,90,.95),0 0 60px rgba(255,190,80,.5)}
/* narration */
#narr{position:absolute;left:110px;width:1700px;top:960px;direction:rtl;display:flex;justify-content:center}
.nl{position:absolute;width:1700px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.26em;row-gap:0;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:50px;line-height:1.45;color:#F3EBD8;text-shadow:0 4px 18px rgba(0,0,0,.75);transform:translateY(-50%)}
.nl .w{display:inline-block}
.nl .w.g{color:#F2C96A}
/* cards */
.card{position:absolute;direction:rtl;text-align:center;padding:40px 70px 34px;border-radius:26px;background:linear-gradient(180deg,rgba(13,40,48,.92),rgba(8,26,32,.92));
  border:2px solid rgba(217,180,106,.85);box-shadow:0 0 0 8px rgba(217,180,106,.12),0 30px 80px rgba(0,0,0,.55),inset 0 0 60px rgba(217,180,106,.08);transform-origin:50% 50%}
.card::before{content:'';position:absolute;inset:10px;border-radius:18px;border:1px solid rgba(217,180,106,.45)}
.card .hd{font-family:'Reem Kufi';font-size:28px;color:#D9B46A;letter-spacing:1px;margin-bottom:10px}
.card .tx{font-family:'Amiri';font-size:54px;line-height:1.6;color:#F7EBD0}
.card .tx .q{color:#FFE3A3}
.card .src{font-family:'Reem Kufi';font-size:27px;color:#D9B46A;margin-top:14px;opacity:.95}
.card .orn{position:absolute;width:34px;height:34px;top:-17px}
.lbl{position:absolute;font-family:'Reem Kufi';color:#F2D594;text-align:center;direction:rtl;transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#hud{position:absolute;left:54px;top:40px;display:flex;align-items:center;gap:16px;direction:rtl;padding:12px 26px 12px 18px;border-radius:999px;background:rgba(8,28,34,.72);border:1.5px solid rgba(217,180,106,.6)}
#hud .n{font-family:'Reem Kufi';font-size:40px;color:#F7E1A6;line-height:1;min-width:150px;text-align:center}
#hud .l{font-family:'IBM Plex Sans Arabic';font-size:20px;color:#CDB98C;line-height:1.1}
.chat{position:absolute;direction:rtl;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:30px;padding:14px 26px;border-radius:26px;white-space:nowrap}
</style>
</head>

<script>
const Q={"basmala": "بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ", "ayat": ["وَٱلۡعَصۡرِ", "إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ", "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ"]};
// ================= utilities =================
const W=1920,H=1080,DUR=167.0;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const E={out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,sine:k=>-(Math.cos(Math.PI*k)-1)/2,
 back:k=>{const c1=1.4,c3=c1+1;return k<=0?0:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)}};
const win=(t,a,b,fi=.6,fo=.6)=>Math.min(E.sine(P(t,a,fi)),1-E.sine(P(t,b-fo,fo)));
const $=id=>document.getElementById(id);
function T(el,x,y,s=1,r=0,o){if(typeof el==='string')el=$(el);if(!el)return;el.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${Math.max(1e-4,s).toFixed(4)})`);if(o!==undefined)el.setAttribute('opacity',clamp(o).toFixed(3));}
function O(el,o){if(typeof el==='string')el=$(el);if(el)el.setAttribute('opacity',clamp(o).toFixed(3));}
function S(el,{x=0,y=0,s=1,o,blur}={}){if(typeof el==='string')el=$(el);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)})`;if(o!==undefined){el.style.opacity=clamp(o).toFixed(3);el.style.display=o<=0.001?'none':'';}if(blur!==undefined)el.style.filter=blur>0.05?`blur(${blur.toFixed(1)}px)`:'none';}
const AR='٠١٢٣٤٥٦٧٨٩';const ar=n=>String(n).replace(/[0-9]/g,d=>AR[d]);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// original voice time -> extended timeline (silence inserted for the verses)
const nt=t=>t+(t>22.1?7:0)+(t>42.7?6:0)+(t>78.1?10:0);
const VERSE_WIN=[[22.1,29.1],[49.7,55.7],[91.1,101.1]]; // pure verse moments (no SFX, no other UI)

// ================= narration (times in ORIGINAL voice seconds) =================
// card:true -> spoken quote, shown in a card instead of the narration line
const NARR=[
 [[0.0,3.16,'عمرك لاحظت إن باقة النت بتخلص آخر الشهر...'],[3.16,7.44,'سواء استخدمتها في حاجة تنفعك، أو ضيّعتها في التقليب؟']],
 [[7.44,9.52,'الوقت كده بالظبط...'],[9.52,13.06,'رأس مال بيخلص كل ثانية، ومابيرجعش.']],
 [[14.14,16.72,'وفيه سورة من تلات آيات بس،'],[16.72,18.40,'قال عنها الإمام الشافعي:']],
 [[22.5,24.32,'ربنا بيقسم بالعصر...'],[24.32,28.16,'والعصر، زي ما قال الإمام الطبري، هو الدهر.'],[28.16,29.48,'يعني الزمن نفسه.']],
 [[30.22,33.36,'والشيخ السعدي بيوصف الليل والنهار'],[33.36,37.06,'إنهم «محل أفعال العباد وأعمالهم»...']],
 [[37.06,40.04,'يعني يومك هو المحل اللي بتشتغل فيه،'],[40.04,42.16,'ورأس مالك فيه... وقتك.']],
 [[43.06,45.1,'كل إنسان في خسارة...'],[45.1,47.82,'والسعدي بيقول إن الخسارة دي درجات،'],[47.82,50.12,'على قد ما الواحد ضيّع.']],
 [[50.12,52.34,'زي صاحب محل فاتح من الصبح،'],[52.34,54.24,'ولا باع ولا اشترى...'],[54.24,57.66,'يقفل آخر اليوم، والإيجار اتدفع، واليوم راح.']],
 [[58.72,61.2,'والنبي صلى الله عليه وسلم قال:']],
 [[66.78,68.06,'رواه البخاري.']],
 [[68.58,71.5,'والمغبون هو اللي باع حاجة غالية...'],[71.5,72.36,'بتمن رخيص.']],
 [[73.32,75.26,'طب إيه طريق الربح؟'],[75.26,77.6,'السورة بتستثني... بأربع صفات.']],
 [[78.6,80.16,'أولاً: الإيمان...'],[80.16,84.12,'وزي ما قال السعدي، الإيمان مايكونش من غير علم.'],[84.12,86.34,'تعرف ربنا، وتصدّق بقلبك.']],
 [[86.86,89.34,'تانياً: العمل الصالح،'],[89.34,90.84,'وده كل خير...']],
 [[90.84,93.66,'صلاتك في وقتها، وإتقانك لشغلك،'],[93.66,96.02,'وكلمة حلوة لأمك وانت راجع تعبان.']],
 [[96.76,99.4,'تالتاً: التواصي بالحق...'],[99.4,101.96,'صاحبك اللي يقولك "يلا نلحق الصلاة"،'],[101.96,103.34,'وانت كمان تفكّره.']],
 [[104.1,106.34,'ورابعاً: التواصي بالصبر...'],[106.34,110.7,'على طاعة ربنا، وعن معصيته، وعلى أقداره الصعبة.']],
 [[110.7,114.72,'زي ما تثبّت صاحبك وهو بيدوّر على شغل، والأبواب مقفولة.']],
 [[114.96,119.48,'والسعدي لاحظ إن أول اتنين بيكمّل بيهم الإنسان نفسه...'],[119.48,121.92,'وآخر اتنين بيكمّل بيهم غيره.']],
 [[122.34,124.3,'يعني معادلة النجاح:'],[124.3,127.0,'إنك تنجح... وتاخد اللي حواليك معاك.']],
 [[127.54,130.36,'واللي يكمّل الأربعة، زي ما قال السعدي:']],
];
const GOLD=['تنفعك،','ثانية،','ومابيرجعش.','الشافعي:','الطبري،','الدهر.','السعدي','«محل','وقتك.','خسارة...','درجات،','غالية...','رخيص.','الربح؟','بأربع','الإيمان...','علم.','الصالح،','خير...','بالحق...','بالصبر...','نفسه...','غيره.','النجاح:','معاك.','الأربعة،'];
const narrRoot=$('narr');const NL=[];
NARR.forEach(parts=>{const el=document.createElement('div');el.className='nl';narrRoot.appendChild(el);const L={el,words:[],start:nt(parts[0][0]),end:nt(parts[parts.length-1][1])};
 parts.forEach(([s,e,txt])=>{s=nt(s);e=nt(e);const ws=txt.split(' ');const wts=ws.map(w=>w.replace(/[.،؟!:«»"]/g,'').length+1.6);const tot=wts.reduce((a,b)=>a+b,0);let c=0;
  ws.forEach((w,j)=>{const sp=document.createElement('span');sp.className='w'+(GOLD.includes(w)?' g':'');sp.textContent=w;el.appendChild(sp);L.words.push({el:sp,t:s+(e-s)*0.92*c/tot-0.08});c+=wts[j];});});
 NL.push(L);});
NL.forEach((L,i)=>{const nx=NL[i+1];L.exit=Math.min(L.end+0.9,nx?nx.start-0.1:L.end+1.2);});
function updateNarr(t){NL.forEach(L=>{const vis=t>=L.start-0.15&&t<L.exit;if(!vis){L.el.style.display='none';return;}L.el.style.display='flex';
  const x=P(t,L.exit-0.35,0.35);L.el.style.opacity=(1-x).toFixed(3);L.el.style.transform=`translateY(calc(-50% + ${(-14*x).toFixed(1)}px))`;
  L.words.forEach(w=>{const k=P(t,w.t,0.55),ke=E.out(k);w.el.style.opacity=ke.toFixed(3);w.el.style.transform=`translateY(${((1-ke)*14).toFixed(1)}px)`;w.el.style.filter=k<1?`blur(${((1-ke)*8).toFixed(1)}px)`:'none';});});}

// ================= quote / tafsir cards =================
const UI=$('ui');
const ORN=`<svg class="orn" viewBox="-60 -60 120 120"><use href="#star8" fill="#0B2A31" stroke="#D9B46A" stroke-width="7"/><circle r="12" fill="#D9B46A"/></svg>`;
function card(id,{hd='',tx,src='',x=960,y=520,w=1300,size=54}){const d=document.createElement('div');d.className='card';d.id=id;d.style.width=w+'px';d.style.left=(x-w/2)+'px';d.style.top=y+'px';
 d.innerHTML=`${ORN.replace('class="orn"','class="orn" style="right:46%"')}${hd?`<div class="hd">${hd}</div>`:''}<div class="tx" style="font-size:${size}px">${tx}</div>${src?`<div class="src">${src}</div>`:''}`;UI.insertBefore(d,narrRoot);return d;}
// every card: [id, opts, inTime(original sec), outTime(original sec)]
const CARDS=[
 ['c_shafii',{hd:'قال الإمام الشافعي',tx:'<span class="q">«لو تدبّر الناسُ هذه السورةَ لوسِعَتْهم»</span>',src:'ذكره الحافظ ابن كثير في تفسيره',y:470,w:1240},18.45,22.0],
 ['c_tabari',{hd:'الإمام الطبري',tx:'<span class="q">«والعصرُ اسمٌ للدهر»</span>',src:'جامع البيان في تأويل القرآن',y:420,w:980,size:60},25.4,30.1],

let ROSE_CACHE=null;
function updateBG(t){
  $('patR').setAttribute('transform',`translate(${((t*6)%200).toFixed(1)} ${((t*3)%200).toFixed(1)})`);
  const verse=VERSE_WIN.some(([a,b])=>t>a-0.5&&t<b+0.5)||t>156.6;
  $('patR').setAttribute('opacity',(0.11+(verse?0.06:0)+0.02*Math.sin(t*.5)).toFixed(3));
  $('bigRosette').setAttribute('transform',`translate(960 470) rotate(${(t*2)%360})`);
  bctx.clearRect(0,0,W,H);
  for(let i=0;i<3;i++){const x=960+Math.sin(t*.10+i*1.9)*560,w=260+i*60;const g=bctx.createLinearGradient(x,0,x,H);g.addColorStop(0,'rgba(255,226,160,0.045)');g.addColorStop(1,'rgba(255,226,160,0)');
    bctx.fillStyle=g;bctx.beginPath();bctx.moveTo(x-w*0.3,-10);bctx.lineTo(x+w*0.3,-10);bctx.lineTo(x+w*1.6,H);bctx.lineTo(x-w*1.6,H);bctx.closePath();bctx.fill();}
  MOTES.forEach(m=>{const y=((m.y-t*m.s)%H+H)%H,x=m.x+Math.sin(t*.4+m.ph)*30;const a=.12+.3*Math.sin(t*1.3+m.ph)**2;bctx.fillStyle=`rgba(255,228,170,${a.toFixed(3)})`;bctx.beginPath();bctx.arc(x,y,m.r,0,6.283);bctx.fill();});
}
// time-capital counter (top-left)
function updateHUD(t){const show=[[7.7,22.0],[29.4,49.55],[55.9,90.9],[101.3,156.5]];const v=show.reduce((a,[s,e])=>Math.max(a,win(t,s,e,0.6,0.5)),0);
  const h=$('hud');h.style.opacity=v.toFixed(3);h.style.display=v<=0.001?'none':'flex';
  $('hudN').textContent=ar(86400-Math.floor(Math.max(0,t-9.5)));
  const lv=0.9-((t-7.7)/160)*0.8;$('hudSandT').setAttribute('transform',`translate(0 ${(-1+(1-lv)*16).toFixed(1)}) scale(1 ${Math.max(0.05,lv).toFixed(3)})`);}

function seek(t){
  updateBG(t);
  SC.forEach(sc=>{const v=win(t,sc.s,sc.e,0.8,0.8);if(v<=0.001){sc.el.style.display='none';return;}sc.el.style.display='block';sc.el.style.opacity=v.toFixed(3);sc.el.style.transform=`scale(${lerp(1.03,1,v).toFixed(4)})`;sc.update(t);});
  updateVerses(t);updateNarr(t);updateCards(t);updateHUD(t);
  $('fade').style.opacity=Math.max(1-t/0.8,P(t,DUR-1.2,1.2)).toFixed(3);
}
window.seek=seek;window.DUR=DUR;seek(0);
</script>
