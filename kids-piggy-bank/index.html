<html lang="ar">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1a1030;font-family:'Baloo Bhaijaan 2',sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#ui{position:absolute;inset:0;pointer-events:none}
#paper{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.16;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(85% 80% at 50% 48%,transparent 62%,rgba(60,20,10,.42) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:#FFF6D8;opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0}
#irisRing{position:absolute;inset:0;pointer-events:none}
/* narration */
.narr{position:absolute;direction:rtl;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.nl{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.24em;line-height:1.3;font-weight:800;color:#FFF8EA;
  text-shadow:0 0 1px #4A220C,3px 3px 0 #4A220C,-3px 3px 0 #4A220C,3px -3px 0 #4A220C,-3px -3px 0 #4A220C,0 4px 0 #4A220C,0 -4px 0 #4A220C,4px 0 0 #4A220C,-4px 0 0 #4A220C,0 10px 18px rgba(40,10,0,.45)}
.w{display:inline-block;position:relative}
.nl .w.gold{color:#FFD447}
.nl .w.purple{color:#D9B8FF}
.nl.big{font-family:'Lalezar',sans-serif;font-weight:400}
/* bubbles */
.bub{position:absolute;direction:rtl;padding:18px 34px 22px;border-radius:44px;background:#FFFDF6;border:6px solid #4A2A16;box-shadow:0 12px 0 rgba(74,42,22,.25),0 18px 40px rgba(0,0,0,.25);
  display:flex;flex-wrap:wrap;justify-content:center;column-gap:.22em;font-weight:800;color:#3A200E;line-height:1.25;width:max-content;max-width:1100px;white-space:nowrap;transform-origin:var(--ox) var(--oy)}
.bub::after{content:'';position:absolute;width:44px;height:44px;background:inherit;border:inherit;border-top:none;border-left:none;bottom:-27px;transform:rotate(45deg) skew(12deg,12deg)}
.bub.tl::after{left:70px}.bub.tr::after{right:70px}
.bub.top::after{bottom:auto;top:-27px;transform:rotate(-135deg) skew(12deg,12deg)}
.bub.Y{border-color:#2F6FC0;background:#F4F9FF}
.bub.T{border-color:#C7362C;background:#FFF5F0}
.bub.B{border-color:#6B44C4;background:#F4EDFF;border-radius:30px 54px 30px 54px}
.bub .name{position:absolute;top:-30px;right:28px;font-size:26px;padding:0 16px;border-radius:20px;color:#fff;font-weight:800;line-height:1.5}
.bub.Y .name{background:#2F6FC0}.bub.T .name{background:#C7362C}.bub.B .name{background:#6B44C4}
.bub .w.hot{color:#7B3FE4}
.bub .w.gold{color:#E89A00}
/* HUD */
#hud{position:absolute;right:46px;top:34px;display:flex;align-items:center;gap:16px;direction:rtl;padding:12px 34px 12px 22px;border-radius:999px;background:linear-gradient(180deg,#FFF6DA,#FFE7A6);border:6px solid #A86A12;box-shadow:0 10px 0 rgba(120,70,10,.35),0 16px 40px rgba(0,0,0,.3);transform-origin:80% 50%}
#hud .num{font-family:'Lalezar';font-size:78px;line-height:1;color:#7A4300;min-width:200px;text-align:center;letter-spacing:2px}
#hud .lab{font-size:30px;font-weight:800;color:#9A5A0C;line-height:1}
#hudGlow{position:absolute;inset:-26px;border-radius:999px;background:radial-gradient(closest-side,rgba(255,215,80,.9),rgba(255,215,80,0));z-index:-1;opacity:0}
.delta{position:absolute;font-family:'Lalezar';font-size:64px;color:#FF4D4D;text-shadow:3px 3px 0 #5A0E0E,-3px 3px 0 #5A0E0E,3px -3px 0 #5A0E0E,-3px -3px 0 #5A0E0E;opacity:0;direction:ltr}
.delta.plus{color:#7CFF6B;text-shadow:3px 3px 0 #0E4A12,-3px 3px 0 #0E4A12,3px -3px 0 #0E4A12,-3px -3px 0 #0E4A12}
.tag{position:absolute;font-family:'Lalezar';direction:rtl;color:#fff;padding:6px 30px 10px;border-radius:22px;font-size:54px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
</style>
</head>

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

 back:k=>{const c1=2.0,c3=c1+1;return k<=0?0:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)},
 elastic:k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1};
const pop=(t,a,d=.5)=>E.back(P(t,a,d));
const bell=(t,a,d)=>{const k=(t-a)/d;return k<0||k>1?0:Math.sin(Math.PI*k)}; // 0..1..0
const $=id=>document.getElementById(id);
function T(el,x,y,s=1,r=0,o){if(typeof el==='string')el=$(el);if(!el)return;const sx=Array.isArray(s)?s[0]:s,sy=Array.isArray(s)?s[1]:s;el.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${Math.max(0.0001,sx).toFixed(4)} ${Math.max(0.0001,sy).toFixed(4)})`);if(o!==undefined)el.setAttribute('opacity',clamp(o).toFixed(3));}
function O(el,o){if(typeof el==='string')el=$(el);if(el)el.setAttribute('opacity',clamp(o).toFixed(3));}
function CSS(el,x,y,s=1,r=0,o){if(typeof el==='string')el=$(el);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${Math.max(0,s).toFixed(4)})`;if(o!==undefined)el.style.opacity=clamp(o).toFixed(3);}
const AR='٠١٢٣٤٥٦٧٨٩';const ar=n=>String(n).replace(/[0-9]/g,d=>AR[d]);

const shake=(t,a,d,amp,f=55)=>{const k=P(t,a,d);return k<=0||k>=1?0:Math.sin(t*f)*amp*(1-k)};

 {sp:'N',parts:[[37.34,38.06,'وبالليل...'],[38.55,40.16,'الحصّالة كانت خفيفة أوي.']],exit:40.5,y:975},

 {sp:'Y',parts:[[51.26,51.82,'يعني...'],[51.94,52.94,'أنا اللي بنده عليه؟!']],exit:53.0,b:{x:1120,y:420,tail:'tr'}},

 {sp:'N',parts:[[60.03,60.58,'تاني يوم،'],[60.74,61.85,'يوسف قرر يجرّب.'],[62.13,63.27,'عمل الواجب على طول...']],exit:63.4,y:975},

 {sp:'B',parts:[[65.29,65.75,'آآآه!'],[65.98,66.47,'سخنة!'],[66.68,67.65,'مش عارف أمسكها!']],exit:67.8,b:{x:1230,y:780,tail:'tl',top:1},size:62},
 {sp:'N',parts:[[67.86,69.98,'وبعدها نزل لعب كورة مع صحابه،'],[69.98,70.98,'وضحك من قلبه.']],exit:71.1,y:975},

 {sp:'Y',parts:[[79.82,81.50,'وأنا هصرفها في حاجة تفيدني...'],[81.70,82.50,'أو تفرّحني!']],exit:82.65,b:{x:1050,y:470,tail:'tr'},gold:['تفيدني...','تفرّحني!']},
 {sp:'B',parts:[[82.75,83.07,'هيهي...'],[83.52,85.39,'طب ممكن تقول بعدين مرة واحدة بس؟']],exit:85.5,b:{x:500,y:760,tail:'tr'},hot:['بعدين'],size:48},
 {sp:'Y',parts:[[85.59,85.95,'لأ!']],exit:86.35,b:{x:1180,y:440,tail:'tr'},size:90},
 {sp:'N',parts:[[86.09,87.27,'وكلمة بعدين؟'],[87.76,88.40,'خلّيها...'],[88.94,89.66,'لبعدين.']],exit:90.1,y:880,purple:['بعدين؟'],gold:['لبعدين.'],size:110,big:true},
];
const NAMES={Y:'يوسف',T:'تيك توك',B:'بعدين'};
// speaking intervals per speaker (for lip-sync)
const SPK={N:[],Y:[],T:[],B:[]};LINES.forEach(L=>L.parts.forEach(p=>SPK[L.sp].push([p[0]-0.03,p[1]+0.05])));
const talking=(sp,t)=>SPK[sp].some(([a,b])=>t>=a&&t<=b)?env(t):0;

// ================= text layer =================
const UI=$('ui');
LINES.forEach(L=>{
  const el=document.createElement('div');
  const size=L.size||(L.sp==='N'?66:56);
  if(L.sp==='N'){el.className='narr';el.style.width='1700px';el.style.left='110px';el.style.top=L.y+'px';}
  else{el.className='bub '+L.sp+' '+(L.b.tail||'tl')+(L.b.top?' top':'');el.style.left=L.b.x+'px';el.style.top=L.b.y+'px';el.style.fontSize=size+'px';if(L.maxw){el.style.whiteSpace='normal';el.style.maxWidth=L.maxw+'px';}else el.style.flexWrap='nowrap';
    el.style.setProperty('--ox',L.b.tail==='tr'?'85%':'15%');el.style.setProperty('--oy','110%');
    const nm=document.createElement('div');nm.className='name';nm.textContent=NAMES[L.sp];el.appendChild(nm);}
  UI.insertBefore(el,$('hud'));L.el=el;L.words=[];L.start=L.parts[0][0];
  let line=el;
  if(L.sp==='N'){line=document.createElement('div');line.className='nl'+(L.big?' big':'');line.style.fontSize=size+'px';el.appendChild(line);}
  L.parts.forEach(([s,e,txt])=>{
    const ws=txt.split(' ');const wts=ws.map(w=>w.replace(/[.،؟!:]/g,'').length+1.5);const tot=wts.reduce((a,b)=>a+b,0);let c=0;
    ws.forEach((w,j)=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w;
      if((L.gold||[]).includes(w))sp.classList.add('gold');
      if((L.hot||[]).includes(w))sp.classList.add(L.sp==='N'?'purple':'hot');
      if((L.purple||[]).includes(w))sp.classList.add('purple');
      line.appendChild(sp);const st=s+(e-s)*0.9*c/tot-0.05;c+=wts[j];L.words.push({el:sp,t:st,special:sp.classList.length>1});});
  });
});
function updateText(t){
  LINES.forEach(L=>{
    const vis=t>=L.start-0.12&&t<L.exit;
    if(!vis){L.el.style.display='none';return;}
    L.el.style.display='flex';
    const x=P(t,L.exit-0.25,0.25);
    if(L.sp==='N'){
      L.el.style.transform=`translateY(calc(-50% + ${(-30*E.in(x)).toFixed(1)}px))`;L.el.style.opacity=(1-x).toFixed(3);
    }else{
