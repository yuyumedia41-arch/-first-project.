<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/cairo.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070B1C;font-family:'Cairo',sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#16204A 0%,#0B1130 55%,#060918 100%)}
#grid{position:absolute;inset:-100px;background-image:linear-gradient(rgba(140,160,255,.055) 2px,transparent 2px),linear-gradient(90deg,rgba(140,160,255,.055) 2px,transparent 2px);background-size:96px 96px}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
#parts{position:absolute;inset:0}
#vignette{position:absolute;inset:0;background:radial-gradient(80% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#text{position:absolute;inset:0}
.block{position:absolute;direction:rtl;display:flex;flex-direction:column;gap:6px}
.line{display:flex;flex-wrap:wrap;column-gap:.26em;row-gap:0;line-height:1.35;color:#F4F6FF;font-weight:900;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.block.c .line{justify-content:center}
.block.r .line{justify-content:flex-start}
.w{display:inline-block;position:relative;will-change:transform}
.w.hl{background:linear-gradient(180deg,#FFE27A,#FFB020);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 22px rgba(255,190,40,.45))}
.w.hl.t{background:linear-gradient(180deg,#7DF7E2,#22C7B0);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 22px rgba(34,211,182,.45))}
.w.hl.c{background:linear-gradient(180deg,#FF9AAE,#FF4E73);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 22px rgba(255,80,120,.45))}
.w .u{position:absolute;right:0;left:0;bottom:.08em;height:.11em;border-radius:99px;background:linear-gradient(90deg,#FFB020,#FFE27A);transform-origin:right center}
.line.muted{color:#A9B4E8;font-weight:700}
.line.acc{color:#FFC93C}
.line.grad .w{background:linear-gradient(100deg,#7DF7E2 0%,#7C9BFF 45%,#FF7AA2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 30px rgba(124,155,255,.55))}
#swipes{position:absolute;inset:0;pointer-events:none}
.band{position:absolute;top:-200px;height:1480px;width:520px;transform-origin:center}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0}
/* phone */
.phone{position:absolute;width:420px;height:840px;border-radius:64px;background:#0E1330;border:12px solid #252F6A;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.06) inset;overflow:hidden}
.ph-head{position:absolute;top:0;left:0;right:0;height:140px;background:linear-gradient(180deg,#22B573,#169C5E);display:flex;align-items:flex-end;gap:14px;padding:0 26px 18px;direction:rtl}
.ph-av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FFE27A,#FF8A4C);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#3B1F00}
.ph-name{color:#fff;font-weight:900;font-size:28px;line-height:1.1}
.ph-name small{display:block;font-size:18px;font-weight:600;opacity:.85}
.ph-body{position:absolute;top:140px;left:0;right:0;bottom:0;background:#E8EEF7}
.bub{position:absolute;max-width:310px;padding:12px 20px 14px;border-radius:26px;font-size:25px;font-weight:700;color:#1A1F36;direction:rtl;line-height:1.35;box-shadow:0 4px 10px rgba(20,30,80,.12);white-space:nowrap}
.bub.in{right:20px;background:#fff;border-top-right-radius:6px;transform-origin:right top}
.bub.out{left:20px;background:#CDF4D6;border-top-left-radius:6px;transform-origin:left top}
.bub .tag{display:block;font-size:16px;font-weight:800;color:#13926A;margin-top:2px}
.typing{position:absolute;left:20px;background:#CDF4D6;border-radius:26px;border-top-left-radius:6px;padding:16px 22px;display:flex;gap:8px}
.typing i{width:12px;height:12px;border-radius:50%;background:#13926A;display:block}
.badge{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 26px;border-radius:999px;font-weight:900;font-size:34px;direction:rtl;color:#0B1130;background:linear-gradient(135deg,#FFE27A,#FFB020);box-shadow:0 20px 50px rgba(255,176,32,.35)}
.digit{position:absolute;font-weight:1000;font-size:760px;line-height:1;color:transparent;-webkit-text-stroke:5px rgba(160,180,255,.13)}
/* post */
.post{position:absolute;width:540px;height:720px;border-radius:40px;background:#FFFFFF;box-shadow:0 40px 120px rgba(0,0,0,.55);overflow:hidden;direction:rtl}
.post-h{height:96px;display:flex;align-items:center;gap:14px;padding:0 24px}
.post-h .ph-av{width:56px;height:56px}
.post-h b{font-size:26px;font-weight:900;color:#1A1F36;line-height:1.1}
.post-h b small{display:block;font-size:17px;color:#8A93B8;font-weight:700}
.post-img{position:relative;height:400px;background:linear-gradient(135deg,#7C5CFF,#FF5C7A);overflow:hidden}
.post-cap{padding:18px 26px 0;font-size:27px;font-weight:800;color:#1A1F36;height:92px;line-height:1.4}
.post-f{display:flex;align-items:center;gap:12px;padding:6px 26px;font-size:30px;font-weight:900;color:#1A1F36}
.prompt{position:absolute;height:100px;border-radius:999px;background:rgba(22,30,74,.92);border:2px solid rgba(124,155,255,.5);display:flex;align-items:center;padding:0 30px 0 14px;gap:18px;direction:rtl;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(124,92,255,.35)}
.prompt span{color:#fff;font-size:30px;font-weight:800;flex:1;white-space:nowrap}
.prompt .send{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7C5CFF,#3DA9FC);flex:none;display:flex;align-items:center;justify-content:center}
.heart{position:absolute;width:44px;height:44px}
.cursorbar{display:inline-block;width:3px;height:32px;background:#7DF7E2;vertical-align:middle;margin-right:4px}
.pill{position:absolute;display:flex;align-items:center;gap:16px;padding:16px 30px 16px 20px;border-radius:999px;background:rgba(20,28,72,.85);border:2px solid rgba(124,155,255,.35);color:#fff;font-weight:900;font-size:40px;direction:rtl;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pill .ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div class="blob" id="b4"></div>
  <canvas id="parts" width="1920" height="1080"></canvas>
  <div id="cam" style="position:absolute;inset:0">
    <div id="scenes"></div>
    <div id="text"></div>
  </div>
  <div id="swipes"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
  <linearGradient id="gV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F7BFF"/><stop offset="1" stop-color="#3DA9FC"/></linearGradient>
  <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DF7E2"/><stop offset="1" stop-color="#14A88F"/></linearGradient>
  <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9AAE"/><stop offset="1" stop-color="#FF3D68"/></linearGradient>
  <linearGradient id="gAI" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DF7E2"/><stop offset=".5" stop-color="#7C9BFF"/><stop offset="1" stop-color="#FF7AA2"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26306E"/><stop offset="1" stop-color="#151C48"/></linearGradient>
  <radialGradient id="rGlow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#9FB2FF" stop-opacity=".35"/><stop offset="1" stop-color="#9FB2FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="rWarm"><stop offset="0" stop-color="#FFD58A" stop-opacity=".9"/><stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity=".45"/></filter>
  <mask id="moonMask"><circle r="46" fill="#fff"/><circle cx="22" cy="-16" r="40" fill="#000"/></mask>
  <path id="heartP" d="M0 30 C -40 0 -60 -20 -40 -40 C -25 -55 -5 -50 0 -32 C 5 -50 25 -55 40 -40 C 60 -20 40 0 0 30 Z"/>
  <path id="starP" d="M0 -60 C 8 -8 8 -8 60 0 C 8 8 8 8 0 60 C -8 8 -8 8 -60 0 C -8 -8 -8 -8 0 -60 Z"/>
 </defs>
</svg>

<script>
// ---------------- utilities ----------------
const W=1920,H=1080,DUR=63.0;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  out:k=>1-Math.pow(1-k,3), in:k=>k*k*k,
  inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  back:k=>{const c1=1.9,c3=c1+1;return k<=0?0:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)},
  elastic:k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1,
};
const pop=(t,a,d=.55)=>E.back(P(t,a,d));
const $=id=>document.getElementById(id);
function T(el,x,y,s=1,r=0,o){ if(typeof el==='string') el=$(el); el.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${Math.max(0,s).toFixed(4)})`); if(o!==undefined) el.setAttribute('opacity',clamp(o).toFixed(3)); }
function CSS(el,x,y,s=1,r=0,o,blur){ if(typeof el==='string') el=$(el); el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg) scale(${Math.max(0,s).toFixed(4)})`; if(o!==undefined) el.style.opacity=clamp(o).toFixed(3); if(blur!==undefined) el.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:'none'; }
const AR='٠١٢٣٤٥٦٧٨٩'; const ar=n=>String(n).replace(/[0-9]/g,d=>AR[d]);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

// ---------------- voice segments (from pause detection) ----------------
const SEG=[
 [0.21,1.61,'إنت صاحب مشروع صغير؟'],
 [2.09,2.93,'طب قولّي بصراحة...'],
 [3.73,5.85,'يومك بيخلص قبل ما شغلك يخلص؟'],
 [6.74,7.82,'عارفين الإحساس ده.'],
 [8.44,10.25,'ردود على العملا، فواتير،'],
 [10.52,11.73,'بوستات للسوشيال ميديا...'],
 [12.15,12.77,'وفي الآخر،'],
 [13.10,14.65,'مفيش وقت للحاجة الأهم:'],
 [15.18,16.52,'إنك تكبّر مشروعك.'],
 [17.24,19.14,'طب إيه رأيك لو قلتلك إن فيه مساعد...'],
 [19.47,21.19,'بيشتغل ٢٤ ساعة،'],
 [21.52,22.23,'مبيتعبش،'],
 [22.55,23.58,'ومش هياخد مرتب؟'],
 [24.13,25.21,'ده الذكاء الاصطناعي!'],
 [26.04,27.13,'تعالى نشوف بيعمل إيه،'],
 [27.31,28.48,'في تلات خطوات بسيطة.'],
 [29.14,29.56,'أولاً:'],
 [29.87,32.32,'بيرد على أسئلة العملا المتكررة على الواتساب...'],
 [32.52,33.06,'في ثواني.'],
 [33.79,34.20,'تانياً:'],
 [34.47,36.01,'بيكتبلك بوستات وإعلانات.'],
 [36.33,37.55,'إنت بس تقوله عايز إيه.'],
 [38.14,38.54,'تالتاً:'],
 [38.83,40.59,'بيرتّبلك الحسابات والفواتير،'],
 [40.82,42.77,'ويطلّعلك تقرير في آخر كل شهر.'],
 [43.38,45.42,'يعني بدل ما تقضي ٣ ساعات في الحاجات دي...'],
 [45.79,47.14,'تخلّصها في ربع ساعة.'],
 [47.78,48.62,'والأهم من كده؟'],
 [49.00,50.08,'الوقت اللي وفّرته ده...'],
 [50.32,50.84,'بتاعك.'],
 [51.31,52.54,'تفكّر، تخطّط،'],
 [52.85,54.24,'أو حتى تقعد مع عيلتك شوية.'],
 [54.87,55.67,'فمتستناش.'],
 [56.03,57.73,'ابدأ النهارده بأداة واحدة بس...'],
 [58.00,59.20,'وشوف الفرق بنفسك.'],
 [59.76,60.81,'مشروعك يستاهل...'],
 [61.10,62.03,'وإنت كمان تستاهل.'],
];
// word start times inside a segment, weighted by word length
function wordTimes(i){const [s,e,txt]=SEG[i];const ws=txt.split(' ');const wts=ws.map(w=>w.replace(/[.،؟!:]/g,'').length+1.5);const tot=wts.reduce((a,b)=>a+b,0);let c=0;return ws.map((w,j)=>{const st=s+(e-s)*0.94*c/tot;c+=wts[j];return st-0.06;});}
const WT=SEG.map((_,i)=>wordTimes(i));
const wt=(i,j)=>WT[i][Math.min(j,WT[i].length-1)];

// ---------------- kinetic typography blocks ----------------
const BLOCKS=[
 {lines:[{segs:[0],size:118,hl:['مشروع','صغير؟']}],y:880,exit:1.98},
 {lines:[{segs:[1],size:58,cls:'muted'},{segs:[2],size:96,hl:['يخلص؟'],hc:'c'}],y:870,exit:6.42},
 {lines:[{segs:[3],size:150}],y:540,exit:8.3},
 {lines:[{segs:[4],size:80,hl:['ردود','فواتير،']},{segs:[5],size:80,hl:['بوستات']}],y:870,exit:12.02},
 {lines:[{segs:[6,7],size:70,cls:'muted'},{segs:[8],size:110,hl:['تكبّر','مشروعك.']}],y:870,exit:16.95},
 {lines:[{segs:[9],size:80,hl:['مساعد...'],hc:'t'}],y:900,exit:19.36},
 {lines:[{segs:[10,11,12],size:68,hl:['٢٤','مبيتعبش،','مرتب؟'],hc:'t'}],y:900,exit:23.85},
 {lines:[{segs:[13],size:150,cls:'grad'}],y:820,exit:25.75},
 {lines:[{segs:[14],size:84}],y:220,exit:28.85},
 {lines:[{segs:[15],size:96,hl:['تلات','خطوات']}],y:880,exit:28.85},
 {lines:[{segs:[16],size:130,cls:'acc'},{segs:[17],size:66},{segs:[18],size:100,hl:['ثواني.'],hc:'t'}],y:540,x:1790,w:1000,align:'r',exit:33.55},
 {lines:[{segs:[19],size:130,cls:'acc'},{segs:[20],size:74,hl:['بوستات','وإعلانات.']},{segs:[21],size:80,hl:['تقوله'],hc:'t'}],y:540,x:1790,w:1000,align:'r',exit:37.9},
 {lines:[{segs:[22],size:130,cls:'acc'},{segs:[23],size:74,hl:['الحسابات']},{segs:[24],size:74,hl:['تقرير'],hc:'t'}],y:540,x:1790,w:1000,align:'r',exit:43.1},
 {lines:[{segs:[25],size:68,hl:['٣','ساعات'],hc:'c'},{segs:[26],size:110,hl:['ربع','ساعة.'],hc:'t'}],y:880,exit:47.5},
 {lines:[{segs:[27],size:150}],y:540,exit:48.95},
 {lines:[{segs:[28],size:76,cls:'muted'},{segs:[29],size:140,hl:['بتاعك.']}],y:860,exit:51.22},
 {lines:[{segs:[30],size:88,hl:['تفكّر،','تخطّط،'],hc:'t'},{segs:[31],size:80,hl:['عيلتك']}],y:880,exit:54.62},
 {lines:[{segs:[32],size:200,hl:['فمتستناش.']}],y:540,exit:55.95},
 {lines:[{segs:[33],size:72,hl:['واحدة']},{segs:[34],size:96,hl:['الفرق'],hc:'t'}],y:885,exit:59.55},
 {lines:[{segs:[35],size:104},{segs:[36],size:128,cls:'grad'}],y:760,exit:99},
];
const textRoot=$('text'); const WORDS=[];
BLOCKS.forEach(b=>{
  const el=document.createElement('div'); el.className='block '+(b.align==='r'?'r':'c');
  const w=b.w||1700, x=b.x||960;
  el.style.width=w+'px';
  if(b.align==='r'){el.style.left=(x-w)+'px';} else el.style.left=(x-w/2)+'px';
  el.style.top=b.y+'px'; textRoot.appendChild(el); b.el=el; b.words=[]; b.start=99;
  b.lines.forEach(L=>{
    const ld=document.createElement('div'); ld.className='line '+(L.cls||''); ld.style.fontSize=L.size+'px'; el.appendChild(ld);
    L.segs.forEach(si=>{
      SEG[si][2].split(' ').forEach((word,j)=>{
        const sp=document.createElement('span'); sp.className='w'; sp.textContent=word;
        const isHl=(L.hl||[]).some(h=>word===h||word.replace(/[.،؟!:]/g,'')===h.replace(/[.،؟!:]/g,''));
        let u=null;
        if(isHl){sp.classList.add('hl'); if(L.hc) sp.classList.add(L.hc); if(!L.hc){u=document.createElement('span');u.className='u';sp.appendChild(u);} }
        ld.appendChild(sp);
        const st=wt(si,j); b.start=Math.min(b.start,st);
        const o={el:sp,u,t:st,hl:isHl,big:L.size>=140}; b.words.push(o);
      });
    });
  });
});
function updateText(t){
  BLOCKS.forEach(b=>{
    const vis=t>=b.start-0.05&&t<b.exit;
    if(!vis){b.el.style.display='none';return;}
    b.el.style.display='flex';
    const x=P(t,b.exit-0.38,0.38), xe=E.in(x);
    b.el.style.transform=`translateY(calc(-50% + ${(-50*xe).toFixed(1)}px)) scale(${(1-0.04*xe).toFixed(3)})`;
    b.el.style.opacity=(1-x).toFixed(3);
    b.el.style.filter=x>0.01?`blur(${(10*x).toFixed(1)}px)`:'none';
    b.words.forEach(w=>{
      const k=P(t,w.t,0.5), kb=E.back(k), ko=clamp(k*2.2);
      const dy=(1-kb)*(w.big?90:60), sc=w.hl?lerp(1.6,1,E.elastic(P(t,w.t,0.9))):lerp(0.85,1,kb);
      w.el.style.opacity=ko.toFixed(3);
      w.el.style.transform=`translateY(${dy.toFixed(1)}px) scale(${sc.toFixed(3)})`;
      if(!w.hl) w.el.style.filter=k<1?`blur(${((1-E.out(k))*14).toFixed(1)}px)`:'none';
      if(w.u) w.u.style.transform=`scaleX(${E.out(P(t,w.t+0.25,0.45)).toFixed(3)})`;
    });
  });
}

// ---------------- background ----------------
const BL=[{id:'b1',c:'#5B4BFF'},{id:'b2',c:'#14C8B0'},{id:'b3',c:'#FF4E7A'},{id:'b4',c:'#FF9F1C'}];
BL.forEach(b=>{$(b.id).style.background=`radial-gradient(circle,${b.c} 0%,transparent 65%)`});
const pr=rng(7); const PARTS=[...Array(90)].map(()=>({x:pr()*W,y:pr()*H,r:1+pr()*2.6,sp:12+pr()*40,ph:pr()*6.28,dr:pr()*20-10}));
const pctx=$('parts').getContext('2d');
function warmth(t){ // 0..1 warm tint for emotional scenes
  return Math.max(clamp((t-50.0)/1.2)*(1-clamp((t-54.4)/0.8)), clamp((t-59.3)/1.0)); }
function updateBG(t){
  $('grid').style.transform=`translate(${((t*14)%96).toFixed(1)}px,${((t*9)%96).toFixed(1)}px)`;

// ---------------- master seek ----------------
function seek(t){
  updateBG(t);
  SC.forEach(sc=>{
    const vis=t>=sc.s&&t<sc.e+0.45;
    if(!vis){sc.el.style.display='none';return;}
    sc.el.style.display='block';
    const ki=sc.s<=0.01?1:E.out(P(t,sc.s,0.45)); const ko=P(t,sc.e,0.45);
    const s=lerp(0.94,1,ki)*(1+0.08*E.in(ko)); const o=ki*(1-ko);
    sc.el.style.opacity=o.toFixed(3); sc.el.style.transform=`scale(${s.toFixed(4)})`;
    sc.el.style.filter=(ko>0.01||ki<0.99)?`blur(${(10*ko+8*(1-ki)).toFixed(1)}px)`:'none';
    sc.update(t);
  });
  updateText(t); updateSwipes(t);
  // camera drift + punch on big moments
  const punch=[24.13,54.87].reduce((a,p)=>a+Math.max(0,1-Math.abs(t-p-0.05)/0.25)*0.025,0);
  $('cam').style.transform=`scale(${(1.0+0.006*Math.sin(t*.35)+punch).toFixed(4)}) translate(${(4*Math.sin(t*.27)).toFixed(1)}px,${(3*Math.cos(t*.31)).toFixed(1)}px)`;
  $('flash').style.opacity=(t>=24.08?Math.max(0,0.85*(1-(t-24.08)/0.4)):0).toFixed(3);
  $('fade').style.opacity=(Math.max(1-t/0.35,P(t,DUR-0.55,0.55))).toFixed(3);
}
