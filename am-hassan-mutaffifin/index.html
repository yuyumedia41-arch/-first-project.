<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#1a0f08}
.layer{position:absolute;inset:0}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
#isl{background:radial-gradient(110% 90% at 50% 38%,#11343D 0%,#0A2129 45%,#051118 100%);opacity:0}
#grain{mix-blend-mode:overlay;opacity:.10;pointer-events:none}
#vig{background:radial-gradient(95% 85% at 50% 48%,transparent 58%,rgba(0,0,0,.55) 100%);pointer-events:none}
.bar{position:absolute;left:0;width:1920px;height:46px;background:#000}
#fade{background:#000;opacity:0}
#flashW{background:#fff;opacity:0}
/* verses */
.verse{position:absolute;left:0;width:1920px;text-align:center;direction:rtl;font-family:'KFGQPC Hafs';color:#F7E6B5;line-height:1.9;white-space:nowrap;text-shadow:0 0 28px rgba(255,214,140,.45),0 0 2px rgba(255,240,200,.8);transform-origin:50% 50%}
#sadaqa{position:absolute;left:0;width:1920px;text-align:center;direction:rtl;font-family:'Amiri';font-weight:700;font-size:86px;color:#F2C96A;text-shadow:0 0 30px rgba(255,200,90,.6)}
/* narration */
#narr{position:absolute;left:110px;width:1700px;top:968px;direction:rtl}
.nl{position:absolute;width:1700px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.26em;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:48px;line-height:1.4;color:#FFF6E4;text-shadow:0 3px 0 rgba(0,0,0,.55),0 4px 22px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9);transform:translateY(-50%)}
.nl .w{display:inline-block}.nl .w.g{color:#FFD166}
/* bubbles */
.bub{position:absolute;direction:rtl;padding:16px 34px 20px;border-radius:38px;background:#FFFDF7;border:5px solid #3A2414;box-shadow:0 10px 0 rgba(40,20,5,.28),0 20px 44px rgba(0,0,0,.35);display:flex;flex-wrap:nowrap;column-gap:.24em;font-family:'IBM Plex Sans Arabic';font-weight:700;color:#2E1A0C;line-height:1.3;width:max-content;white-space:nowrap;transform-origin:var(--ox) 115%}
.bub::after{content:'';position:absolute;width:40px;height:40px;background:inherit;border:inherit;border-top:none;border-left:none;bottom:-25px;transform:rotate(45deg) skew(12deg,12deg)}
.bub.tl::after{left:64px}.bub.tr::after{right:64px}
.bub .name{position:absolute;top:-27px;right:26px;font-family:'Reem Kufi';font-size:24px;padding:1px 16px 3px;border-radius:16px;color:#fff;line-height:1.4}
.bub.H{border-color:#8A4B14;background:#FFF7E8}.bub.H .name{background:#8A4B14}
.bub.C{border-color:#2C6CA8;background:#F3F9FF}.bub.C .name{background:#2C6CA8}
.bub.M{border-color:#2F6B4A;background:#F2FBF4}.bub.M .name{background:#2F6B4A}
.bub.shout{border-width:7px;border-radius:18px 44px 18px 44px}
.bub .w.g{color:#C8102E}
/* lower third */
.lt{position:absolute;direction:rtl;display:flex;align-items:stretch;font-family:'Reem Kufi'}
.lt .a{background:#F2B544;color:#2A1606;font-size:50px;padding:4px 30px 10px;border-radius:0 14px 14px 0}
.lt .b{background:rgba(20,12,6,.86);color:#FFE9C4;font-size:30px;padding:16px 26px 10px;border-radius:14px 0 0 14px}
.tag{position:absolute;direction:rtl;font-family:'Lalezar';font-size:46px;padding:4px 26px 8px;border-radius:14px;color:#fff;white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.25)}
/* cards */
.card{position:absolute;direction:rtl;text-align:center;padding:38px 66px 32px;border-radius:26px;background:linear-gradient(180deg,rgba(13,40,48,.93),rgba(8,26,32,.93));border:2px solid rgba(217,180,106,.85);box-shadow:0 0 0 8px rgba(217,180,106,.12),0 30px 80px rgba(0,0,0,.55),inset 0 0 60px rgba(217,180,106,.08)}
.card::before{content:'';position:absolute;inset:10px;border-radius:18px;border:1px solid rgba(217,180,106,.45)}
.card .hd{font-family:'Reem Kufi';font-size:28px;color:#D9B46A;margin-bottom:8px}
.card .tx{font-family:'Amiri';font-size:52px;line-height:1.6;color:#F7EBD0}.card .tx .q{color:#FFE3A3}
.card .src{font-family:'Reem Kufi';font-size:26px;color:#D9B46A;margin-top:12px}
.card .ln{opacity:0}
.sign{font-family:'Lalezar'}
</style>
</head>
